name: Release

# Start from the Actions tab ("Run workflow") or with `gh workflow run release.yml`.
# Releases what is under "## [Unreleased]" in CHANGELOG.md: commits the new version to
# CHANGELOG.md, flickralbum.xml and update.xml on main, tags it and creates the GitHub
# release with the zip attached.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (YY.WW.PATCH). Leave empty for the current ISO week.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare release
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
        run: build/prepare-release.sh "$VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md flickralbum.xml update.xml
          git commit -m "release plg_content_flickralbum $VERSION"
          git tag "$VERSION"
          git push --atomic origin main "refs/tags/$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          gh release create "$VERSION" build/plg_content_flickralbum.zip \
            --title "plg_content_flickralbum $VERSION" \
            --notes-file build/RELEASE_NOTES.md \
            --verify-tag
