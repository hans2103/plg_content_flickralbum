PLG_CONTENT_FLICKRALBUM = "Content - Flickr Album"
PLG_CONTENT_FLICKRALBUM_ERROR_NO_USERID = "De Flickr-gebruikers-ID ontbreekt. Geef hem op in de tag of in de plugininstellingen."
PLG_CONTENT_FLICKRALBUM_FLICKRUSERID = "Flickr-gebruikers-ID"
PLG_CONTENT_FLICKRALBUM_XML_DESCRIPTION = "<p>Contentplugin die een openbaar Flickr-album toont met de shortcode {flickr album=ALBUMID user=USERID}.</p><p>Je Flickr-gebruikers-ID is de unieke code van je Flickr-account. Je vindt hem zo:</p><ol><li><strong>Via de URL van je Flickr-profiel</strong><br>Open je Flickr-profiel in de browser. De URL ziet er zo uit:<br><ol><li>Met een <strong>eigen gebruikersnaam</strong>:<br><code>https://www.flickr.com/photos/jouwgebruikersnaam/</code><br>Dan is <code>jouwgebruikersnaam</code> je Flickr-gebruikers-ID.</li><li><strong>Zonder</strong> eigen gebruikersnaam:<br><code>https://www.flickr.com/photos/12345678@N00/</code><br>Dan is <code>12345678@N00</code> je Flickr-gebruikers-ID.</li></ol></li><li><strong>Via de URL van een album</strong><br><ol><li>Open de albumpagina op Flickr.</li><li>De URL ziet er zo uit:<br><code>https://www.flickr.com/photos/12345678@N00/albums/12345678901234567</code></li><li>Het deel tussen <code>/photos/</code> en <code>/albums/</code> is de gebruikers-ID (hier <code>12345678@N00</code>).</li></ol></li></ol><hr><p><strong>Voorbeeld</strong></p><p>Als de album-URL dit is:<br><code>https://www.flickr.com/photos/98765432@N04/albums/72177720301234567</code><br>dan is de Flickr-gebruikers-ID:<br><code>98765432@N04</code></p><p>Gebruik je de systeemplugin HTTP Headers met een Content Security Policy, voeg dan <code>https://embedr.flickr.com</code> toe aan <code>frame-src</code>.</p>"
