name: Release

# Push a YY.WW.PATCH tag (with a matching CHANGELOG.md section) to release.
on:
  push:
    tags:
      - '[0-9][0-9].[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ ! "$VERSION" =~ ^[0-9]{2}\.[0-9]{1,2}\.[0-9]+$ ]]; then
            echo "Tag $VERSION is not in YY.WW.PATCH format"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Build package
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s|<version>.*</version>|<version>$VERSION</version>|" flickralbum.xml
          build/build.sh
          echo "sha512=$(sha512sum build/plg_content_flickralbum.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" build/plg_content_flickralbum.zip \
            --title "plg_content_flickralbum $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag

      - name: Point flickralbum.xml and update.xml on main at this release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA512: ${{ steps.build.outputs.sha512 }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          sed -i "s|<version>.*</version>|<version>$VERSION</version>|" flickralbum.xml
          sed -i \
            -e "s|<version>.*</version>|<version>$VERSION</version>|" \
            -e "s|releases/tag/[^<]*</infourl>|releases/tag/$VERSION</infourl>|" \
            -e "s|releases/download/[^/]*/plg_content_flickralbum.zip|releases/download/$VERSION/plg_content_flickralbum.zip|" \
            -e "s|<sha512>.*</sha512>|<sha512>$SHA512</sha512>|" \
            update.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flickralbum.xml update.xml
          git commit -m "release plg_content_flickralbum $VERSION" || echo "Nothing to commit"
          git push origin main
